name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm exec prettier --check .
      - run: node dev/check-release-integrity.mjs
      # Plan 077: dependency audit gate (fails only on high/critical; the
      # local baseline is 1 low + 5 moderate, none high).
      - run: pnpm audit --audit-level=high

  # Plan 077: Rust advisory audit on linux only (cargo-audit recompiles
  # per run; windows/macos matrix legs would triple the cost for nothing).
  audit-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # cargo-audit auto-detects Cargo.lock from the working directory
      # (no --manifest-path flag in 0.22); run from the crate root.
      - working-directory: src-tauri
        run: cargo audit

  desktop:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: pnpm install --frozen-lockfile
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tauri-action only uploads when a tag/release is configured; without
      # one it builds and discards the bundles. Upload them explicitly so
      # every push exposes fresh installers as run artifacts (macOS dmg +
      # .app, Windows msi + nsis).
      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: papyrus-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: warn
