[package]
name = "papyrus"
version = "0.1.0"
description = "Papyrus — latest research papers, explained by your own AI"
authors = ["Papyrus contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "papyrus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
tokio = { version = "1.53.1", features = ["time", "rt"] }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "charset", "http2", "stream", "json"] }
tauri-plugin-keyring = "0.1.0"
futures-util = "0.3.33"
